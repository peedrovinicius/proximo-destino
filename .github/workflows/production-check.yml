name: Production read-only checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-check.yml'
      - 'scripts/check-production.mjs'
permissions:
  contents: read
concurrency:
  group: production-read-only-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/check-production.mjs
